<svg width="1100" height="380" viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="380" rx="32" fill="url(#bg)"/>
  <rect x="2" y="2" width="1096" height="376" rx="31" fill="none" stroke="#21262d" stroke-width="3"/>
  <circle cx="38" cy="38" r="7.5" fill="#ff5f56"/>
  <circle cx="63" cy="38" r="7.5" fill="#ffbd2e"/>
  <circle cx="88" cy="38" r="7.5" fill="#27c93f"/>

  <!-- ===== parrot mascot (scaled to sit inside the frame) ===== -->
  <g transform="translate(178,196) scale(0.82)">
    <!-- tail feathers (short, tucked) -->
    <path d="M-22 56 q -16 46 -46 64 q -6 -42 28 -82 z" fill="#f59e0b"/>
    <path d="M3 60 q 2 46 -16 70 q -14 -38 -2 -78 z" fill="#fbbf24"/>
    <path d="M26 56 q 20 42 6 78 q -20 -38 -28 -74 z" fill="#0f766e"/>
    <!-- feet -->
    <path d="M-22 110 l0 18 M-33 128 l22 0" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <path d="M26 110 l0 18 M15 128 l22 0" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="0" cy="30" rx="80" ry="88" fill="url(#bird)"/>
    <ellipse cx="0" cy="48" rx="48" ry="58" fill="#bbf7d0"/>
    <!-- wings -->
    <path d="M-78 -2 q -22 46 -2 90 q 26 -10 30 -56 z" fill="#0f766e"/>
    <path d="M78 -2 q 22 46 2 90 q -26 -10 -30 -56 z" fill="#0f766e"/>
    <!-- crest -->
    <path d="M-22 -126 q -10 -30 8 -44 q 10 18 4 46 z" fill="#fbbf24"/>
    <path d="M2 -134 q -2 -34 16 -46 q 6 24 -4 50 z" fill="#f59e0b"/>
    <path d="M24 -126 q 12 -28 30 -30 q -2 24 -18 42 z" fill="#fbbf24"/>
    <!-- head -->
    <circle cx="0" cy="-62" r="76" fill="url(#bird)"/>
    <!-- eyes (looking forward, slight converge) -->
    <circle cx="-33" cy="-68" r="26" fill="#ffffff"/>
    <circle cx="33" cy="-68" r="26" fill="#ffffff"/>
    <circle cx="-29" cy="-64" r="14" fill="#0b1220"/>
    <circle cx="29" cy="-64" r="14" fill="#0b1220"/>
    <circle cx="-35" cy="-70" r="5" fill="#ffffff"/>
    <circle cx="23" cy="-70" r="5" fill="#ffffff"/>
    <!-- beak (hooked) -->
    <path d="M0 -50 q 27 0 25 24 q -2 23 -25 31 q -23 -8 -25 -31 q -2 -24 25 -24 z" fill="#fb923c"/>
    <path d="M-14 -32 q 14 12 28 0 q -4 16 -14 18 q -10 -2 -14 -18 z" fill="#ea580c"/>
    <circle cx="-9" cy="-44" r="2.4" fill="#9a3412"/>
    <circle cx="9" cy="-44" r="2.4" fill="#9a3412"/>
    <!-- headset (compact ear cups) -->
    <path d="M-74 -64 q 74 -90 148 0" fill="none" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-74" cy="-52" r="15" fill="#cbd5e1"/><circle cx="-74" cy="-52" r="7.5" fill="#475569"/>
    <circle cx="74" cy="-52" r="15" fill="#cbd5e1"/><circle cx="74" cy="-52" r="7.5" fill="#475569"/>
    <!-- mic boom + capsule -->
    <path d="M-74 -38 q -28 38 26 30" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-44" cy="-12" rx="11" ry="8" fill="#475569" transform="rotate(22 -44 -12)"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(322,52)">
    <rect x="0" y="0" width="262" height="72" rx="16" fill="#1f2937" stroke="#34d399" stroke-width="2.5"/>
    <path d="M26 72 l -18 30 l 42 -30 z" fill="#1f2937"/>
    <path d="M26 72 l -18 30 l 42 -30" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="22" y="33" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#a7f3d0">psst&#8230; press</text>
    <text x="22" y="57" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="bold" fill="#fbbf24">h &#8212; i got you</text>
  </g>

  <!-- title block -->
  <text x="404" y="208" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="56" fill="#e6edf3">Interview Copilot</text>
  <text x="406" y="246" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#7d8590">reads your repo &#183; whispers the answer &#183; lives in your terminal</text>
  <g transform="translate(406,268)">
    <rect x="0" y="0" width="140" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="22" cy="20" r="6" fill="#34d399"/>
    <text x="38" y="27" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#9fb0c0">deepgram</text>
  </g>
  <g transform="translate(560,268)">
    <rect x="0" y="0" width="200" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="22" cy="20" r="6" fill="#fbbf24"/>
    <text x="38" y="27" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#9fb0c0">claude api+cli</text>
  </g>
</svg>
