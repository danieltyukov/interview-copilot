[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "0.1.1"
description = "Sparky — live, on-device in-person interview copilot: transcribe the room and draft first-person answers from your project's context."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "numpy>=1.24",
    "websocket-client>=1.6",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
interview-copilot = "interview_copilot.cli:main"

[tool.setuptools]
packages = ["interview_copilot"]
