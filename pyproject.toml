[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-copilot"
version = "0.2.0"
description = "Sparky — live, on-device in-person meeting copilot: transcribe the room and draft first-person answers from your project's context."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "numpy>=1.24",
    "websocket-client>=1.6",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meeting-copilot = "meeting_copilot.cli:main"

[tool.setuptools]
packages = ["meeting_copilot"]
